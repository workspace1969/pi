a{color:#2646FF}a:hover{color:#0A0E1F}

<body>
<div style="font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #0A0E1F; background: #FAFAF8; min-height: 100vh">
<header style="border-bottom: 1px solid #E4E4E0; background: #FAFAF8">
<nav style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="daybreak-home.html" aria-label="Day Break, Search Intent to ROI" style="text-decoration: none; display: inline-flex; flex-direction: column; align-items: stretch; gap: 6px"><span style="font-weight: 900; font-size: 44px; line-height: 0.95; letter-spacing: -0.02em; color: #2646FF; white-space: nowrap">Day <span style="color: #FF5A36">Break</span></span><span aria-hidden="true" style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: #55596A; line-height: 1"><span>S</span><span>E</span><span>A</span><span>R</span><span>C</span><span>H</span><span style="display: inline-block; width: 0.3em"></span><span>I</span><span>N</span><span>T</span><span>E</span><span>N</span><span>T</span><span style="display: inline-block; width: 0.3em"></span><span>T</span><span>O</span><span style="display: inline-block; width: 0.3em"></span><span>R</span><span>O</span><span>I</span></span></a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 15px">

<a href="daybreak-contact.html" style="color: #0A0E1F; text-decoration: none; font-weight: 800">Contact</a>
<a href="daybreak-book-a-demo.html" style="background: #2646FF; color: #FFFFFF; text-decoration: none; padding: 12px 20px; border-radius: 999px; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">BOOK A DEMO</a>
</div>
</nav>
</header>
<section style="max-width: 820px; margin: 0 auto; padding: 88px 24px 40px; display: flex; flex-direction: column; gap: 22px; text-align: center; align-items: center">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #2646FF">CONTACT</div>
<h1 style="margin: 0; font-size: 64px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em">How Can We Help?</h1>
</section>
<section style="max-width: 820px; margin: 0 auto; padding: 24px 24px 112px">
<form data-form novalidate style="background: #FFFFFF; border: 1px solid #E4E4E0; border-radius: 24px; padding: 40px; display: flex; flex-direction: column; gap: 18px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px"><div style="display: flex; flex-direction: column; gap: 8px"><label for="c-name" style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em">NAME</label><input id="c-name" name="c-name" type="text" required placeholder="" style="font-family: inherit; font-size: 17px; padding: 14px 16px; border: 1.5px solid #C9CBD6; border-radius: 12px; background: #FAFAF8; color: #0A0E1F; min-height: 52px; width: 100%; box-sizing: border-box"></div><div style="display: flex; flex-direction: column; gap: 8px"><label for="c-email" style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em">EMAIL</label><input id="c-email" name="c-email" type="email" required placeholder="" style="font-family: inherit; font-size: 17px; padding: 14px 16px; border: 1.5px solid #C9CBD6; border-radius: 12px; background: #FAFAF8; color: #0A0E1F; min-height: 52px; width: 100%; box-sizing: border-box"></div></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px"><div style="display: flex; flex-direction: column; gap: 8px"><label for="c-company" style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em">COMPANY</label><input id="c-company" name="c-company" type="text" placeholder="" style="font-family: inherit; font-size: 17px; padding: 14px 16px; border: 1.5px solid #C9CBD6; border-radius: 12px; background: #FAFAF8; color: #0A0E1F; min-height: 52px; width: 100%; box-sizing: border-box"></div><div style="display: flex; flex-direction: column; gap: 8px"><label for="c-who" style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em">I’M REACHING OUT AS</label><select id="c-who" name="c-who" required style="font-family: inherit; font-size: 17px; padding: 14px 16px; border: 1.5px solid #C9CBD6; border-radius: 12px; background: #FAFAF8; color: #0A0E1F; min-height: 52px; width: 100%; box-sizing: border-box"><option value="" selected disabled>Choose One</option><option>Someone Who Wants a Demo</option><option>A Business Interested in Daybreak</option><option>An Agency or Reseller</option><option>Media</option><option>A Potential Partner</option><option>Careers</option><option>Something Else</option></select></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="c-msg" style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em">MESSAGE</label><textarea id="c-msg" name="c-msg" required rows="5" placeholder="" style="font-family: inherit; font-size: 17px; padding: 14px 16px; border: 1.5px solid #C9CBD6; border-radius: 12px; background: #FAFAF8; color: #0A0E1F; min-height: 52px; width: 100%; box-sizing: border-box; resize: vertical; line-height: 1.5"></textarea></div>
<button type="submit" style="align-self: flex-start; font-family: inherit; background: #2646FF; color: #FFFFFF; border: 0; padding: 16px 26px; border-radius: 999px; font-weight: 700; font-size: 14px; letter-spacing: 0.06em; cursor: pointer; min-height: 52px">SEND MESSAGE</button>
<p data-sent style="display: none; margin: 0; padding: 16px 18px; border-left: 3px solid #2646FF; background: #FAFAF8; border-radius: 8px; font-weight: 600"></p><p style="margin: 0; font-size: 14px; color: #55596A">We read every message and never share your details. See our <a href="daybreak-privacy.html">Privacy Policy</a>.</p>
</form>
</section>
<section style="background: #0A0E1F; color: #FAFAF8">
<footer style="border-top: 1px solid #2B3047">
<div style="max-width: 1240px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 14px; color: #9FA3B8">
<span>Day Break: Search Intent to ROI. By <a href="https://teamnirvanausa.com/" target="_blank" rel="noopener" style="color: #9FA3B8">Team Nirvana</a>.</span>
<span><a href="daybreak-home.html#how" style="color: #9FA3B8">How It Works</a> · <a href="daybreak-home.html#buy" style="color: #9FA3B8">Packages</a> · <a href="daybreak-contact.html" style="color: #9FA3B8">Contact</a> · <a href="daybreak-privacy.html" style="color: #9FA3B8">Privacy</a></span>
</div>
</footer>
</section>
</div>
<script>
var who = document.getElementById('c-who');
if (who) who.addEventListener('change', function () { if (who.value === 'Someone Who Wants a Demo') window.location.href = 'daybreak-book-a-demo.html'; });
document.querySelectorAll('form[data-form]').forEach(function (f) {
  f.addEventListener('submit', function (e) {
    e.preventDefault(); var ok = true, first = null;
    f.querySelectorAll('[required]').forEach(function (el) {
      var good = el.type === 'email' ? /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(el.value.trim()) : !!el.value.trim();
      el.style.borderColor = good ? '#C9CBD6' : '#B3261E'; el.setAttribute('aria-invalid', String(!good)); if (!good) { ok = false; first = first || el; }
    });
    var s = f.querySelector('[data-sent]');
    if (!ok) { first.focus(); s.textContent = 'Please fill in the highlighted fields.'; s.style.display = 'block'; return; }
    s.textContent = 'Demo only. This form isn’t connected to an inbox yet, so nothing was sent.'; s.style.display = 'block';
  });
});
</script>
</body>
